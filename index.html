<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecasting</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <div class="app-container">

      <!-- Header Section with Icon Toggle -->
      <div class="header-section">
        <h1>Weather Forecasting</h1>
        <button id="themeToggleBtn" type="button" class="theme-btn">

        </button>
      </div>

      <p class="subtitle">Enter a city name to get the latest weather updates.</p>

      <!-- Search Section with Search Icon -->
      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name...">
        <button id="searchBtn">
          <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
      </div>
      <!-- Loading Spinner Container -->
     <div class="loader" id="loader" style="display: none;">
      <div class="spinner"></div>
      <p>Fetching weather data...</p>
      </div>

      <!-- Recent Searches Container -->
      <div class="recent-searches">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Searches</h3>
        <div id="recentList">
          <!-- Dynamically populated by JS -->
        </div>
      </div>

      <!-- Error Message Box -->
      <div class="error-box" id="errorMsg" style="display: none;">
        <p>City not found. Please try again.</p>
      </div>

      <!-- Weather Info Card -->
      <div class="weather-info" id="weatherCard">
        <h2 id="cityName">Lahore, PK</h2>
        <img id="weatherIcon" src="https://openweathermap.org/img/wn/01d@2x.png" alt="Weather Icon">
        <p class="temp" id="tempDisplay">25°C</p>
        <p class="condition" id="weatherCondition">Clear Sky</p>
        
        <div class="details">
          <p><i class="fa-solid fa-droplet"></i> Humidity: <span id="humidity">60%</span></p>
          <p><i class="fa-solid fa-wind"></i> Wind Speed: <span id="windSpeed">10 m/s</span></p>
        </div>
      </div>

      <footer>
        <p>&copy; 2026 Weather Forecasting. All rights reserved.</p>
      </footer>
    </div>

    <!-- External JavaScript Link -->
    <script src="script.js"></script>
  </body>
</html>
